name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg Binaries for Offline Bundling
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-win-64.zip" -OutFile "bin\ffmpeg.zip"
          Expand-Archive -Path "bin\ffmpeg.zip" -DestinationPath "bin" -Force
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-win-64.zip" -OutFile "bin\ffprobe.zip"
          Expand-Archive -Path "bin\ffprobe.zip" -DestinationPath "bin" -Force
          Remove-Item "bin\*.zip" -Force

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --clean `
            --icon=app_icon.ico `
            --add-data "app_icon.png;." `
            --add-data "app_icon.ico;." `
            --add-data "src;src" `
            --add-binary "bin/ffmpeg.exe;." `
            --add-binary "bin/ffprobe.exe;." `
            --collect-all customtkinter `
            --collect-all pystray `
            --paths "src" `
            --name "ORCUS Downloader" `
            main.py

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ORCUS Downloader.exe
          name: "ORCUS Downloader ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
