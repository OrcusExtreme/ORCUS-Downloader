name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --clean `
            --icon=app_icon.ico `
            --add-data "app_icon.png;." `
            --add-data "app_icon.ico;." `
            --add-data "src;src" `
            --collect-all customtkinter `
            --collect-all pystray `
            --paths "src" `
            --name "ORCUS Downloader" `
            main.py

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ORCUS Downloader.exe
          name: "ORCUS Downloader ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
