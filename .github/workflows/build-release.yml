name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Release Tag Matches App Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $iss = Get-Content setup.iss -Raw
          if ($iss -notmatch '#define MyAppVersion "([^"]+)"') { throw "MyAppVersion not found in setup.iss" }
          $ver = $Matches[1]
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match setup.iss version v$ver" }
          if ((Get-Content src/version.py -Raw) -notmatch "__version__ = `"$([regex]::Escape($ver))`"") { throw "src/version.py does not match setup.iss version $ver" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg Binaries for Offline Bundling
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-win-64.zip" -OutFile "bin\ffmpeg.zip"
          Expand-Archive -Path "bin\ffmpeg.zip" -DestinationPath "bin" -Force
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-win-64.zip" -OutFile "bin\ffprobe.zip"
          Expand-Archive -Path "bin\ffprobe.zip" -DestinationPath "bin" -Force
          Remove-Item "bin\*.zip" -Force

      - name: Download Deno JS Runtime (yt-dlp YouTube challenge solver)
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "bin\deno.zip"
          Expand-Archive -Path "bin\deno.zip" -DestinationPath "bin" -Force
          Remove-Item "bin\deno.zip" -Force

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --clean `
            --icon=app_icon.ico `
            --add-data "app_icon.png;." `
            --add-data "app_icon.ico;." `
            --add-data "src;src" `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all yt_dlp_ejs `
            --collect-all pystray `
            --paths "src" `
            --name "ORCUS.Downloader" `
            main.py
          python -m PyInstaller ORCUS_Downloader.spec --clean --noconfirm

      - name: Compile Inno Setup Installer
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ORCUS.Downloader.exe
            installer_output/*.exe
          name: "ORCUS Downloader ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
